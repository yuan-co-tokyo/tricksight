name: Supabase keep alive

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Check secret
        run: test -n "$DATABASE_URL"
      - name: Run lightweight query
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command "select 1;"
